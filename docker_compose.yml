services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379

    expose:
      - "8000"

    depends_on:
      - redis

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    restart: unless-stopped